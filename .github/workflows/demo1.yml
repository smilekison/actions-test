name: Test Project
on: 
  pull_request:
    types:
      - opened
  workflow_dispatch:
    
jobs:
  deploy:
    name: Build, test and secret scan
    runs-on: ubuntu-latest 
    steps:
      - name: Output event data
        run: echo "Event data: ${{ toJson(github.event) }}"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install latest dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Deploy project
        run: echo "Deploying project..."